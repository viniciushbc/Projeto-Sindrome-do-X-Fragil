<div class="sigma-page">
  <app-header></app-header>

  <!-- Barra de busca + ação -->
  <div class="sigma-actionbar">
    <div class="sigma-search">
      <input pInputText type="text" placeholder="Buscar por nome"
        [(ngModel)]="busca" (input)="filtrarPacientes()" />
      <button pButton icon="pi pi-search" class="btn-primary btn-icon"
        (click)="filtrarPacientes()"></button>
    </div>
    <div class="sigma-actionbar-end">
      <button pButton type="button" label="Voltar" icon="pi pi-arrow-left"
        class="btn-secondary" (click)="voltarMenu()"></button>
      <button pButton type="button" label="Novo Paciente" icon="pi pi-plus"
        class="btn-primary" (click)="novoPaciente()"></button>
    </div>

  </div>

  <!-- Tabela full-width -->
  <div class="sigma-content sigma-table-full">
    <p-table [value]="pacientesFiltrados" [loading]="loading"
      [paginator]="true" [rows]="10" responsiveLayout="scroll">
      <ng-template pTemplate="header">
        <tr>
          <th>ID</th>
          <th>Nome Completo</th>
          <th>Sexo</th>
          <th>Data Nascimento</th>
          <th>Telefone</th>
          <th>Responsável</th>
          <th style="text-align:center">Status</th>
          <th style="text-align:center">Ações</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-p>
        <tr>
          <td>{{ p.id_paciente }}</td>
          <td>{{ p.nome }}</td>
          <td>{{ p.sexo }}</td>
          <td>{{ p.data_nascimento ? (p.data_nascimento | date:'dd/MM/yyyy') : '—' }}</td>
          <td>{{ p.telefone || '—' }}</td>
          <td>{{ p.responsavel || '—' }}</td>
          <td style="text-align:center">
            <p-tag [value]="p.ativo ? 'Ativo' : 'Inativo'"
              [severity]="p.ativo ? 'success' : 'danger'"></p-tag>
          </td>
          <td style="text-align:center">
            <button pButton icon="pi pi-pencil" class="btn-primary btn-icon"
              style="margin-right:6px" (click)="editarPaciente(p)"></button>
            <button pButton icon="pi pi-eye" class="btn-secondary btn-icon"
              (click)="verDetalhes(p)"></button>

            <button pButton 
            [icon]="p.ativo ? 'pi pi-ban' : 'pi pi-check'"
            [class]="p.ativo ? 'btn-danger btn-icon' : 'btn-success btn-icon'"
            [pTooltip]="p.ativo ? 'Desativar paciente' : 'Ativar paciente'"  style="margin-left:6px"
            (click)="alterarStatus(p)"></button>
            </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr><td colspan="8" class="vazio">Nenhum paciente encontrado.</td></tr>
      </ng-template>
    </p-table>
  </div>
</div>
