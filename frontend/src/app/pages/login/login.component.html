<div class="login-container">
  <h1>Login de Acesso</h1>
  <h2>Acesse sua conta</h2>

  <div class="field">
    <label for="cpfEmail">Digite seu CPF ou Email:</label>
    <input id="cpfEmail" type="text" class="input-field">
  </div>

  <div class="field">
    <label for="senha">Digite sua senha:</label>
    <input id="senha" type="password" class="input-field">
  </div>

  <button label="Entrar">Entrar</button>

  <div class="links">
    <a href="#">Esqueceu a senha?</a>
  </div>
</div>
